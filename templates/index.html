<!DOCTYPE html>
<html>
<head>
    <title>Student Attendance Insight Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Student Attendance Insight Generator</h1>
    <p>Enter your attendance percentage to receive AI-powered performance feedback.</p>

    <form method="POST">
        <input
            type="number"
            name="user_input"
            placeholder="Enter attendance percentage"
            min="0"
            max="100"
            step="0.01"
            value="{{ user_input }}"
            required
        >
        <button type="submit">Generate Feedback</button>
    </form>

    {% if result %}
    <div class="result">
        <h2>Attendance Insights</h2>
        <div class="feedback">{{ result }}</div>
    </div>
    {% endif %}

</div>

</body>
</html>
